name: CI/CD

# Désactivé — pas de CI/CD pour l'instant (projet portfolio local-first)
# Voir README.md section "CI/CD" pour les détails.
# Réactiver en supprimant le "[]" ci-dessous et en décommentant les triggers.
on: []

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─── TESTS ────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-rag.txt
          pip install -r requirements/requirements-api.txt
          pip install pytest

      - name: Lancer les tests unitaires
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: pytest tests/ -v --tb=short

  # ─── BUILD & PUSH DOCKER ──────────────────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ─── DÉPLOIEMENT (symbolique) ─────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement (placeholder)
        run: |
          echo "Déploiement simulé — pas de serveur cible configuré."
          echo "Image disponible : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"